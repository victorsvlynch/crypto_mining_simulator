services:
  crypto-mining-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_mining_simulator_casa_grande
    ports:
      - "8506:8506"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8506
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8506/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
